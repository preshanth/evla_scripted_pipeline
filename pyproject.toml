[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evla_pipeline"
version = "2.0.0"
description = "Automated calibration pipeline for VLA data"
readme = "README.md"
authors = [
    {name = "National Radio Astronomy Observatory", email = "help@nrao.edu"}
]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy >= 1.20.0",
    "scipy >= 1.5.0",
    "casatasks >= 6.1",
    "casatools >= 6.1",
    "casaplotms >= 6.1",
]

[project.urls]
Homepage = "https://github.com/your-org/evla-scripted-pipeline"
Repository = "https://github.com/your-org/evla-scripted-pipeline"
"Bug Tracker" = "https://github.com/your-org/evla-scripted-pipeline/issues"

[project.scripts]
evla-pipeline = "evla_pipe.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evla_pipe*"]

[tool.setuptools.package-data]
evla_pipe = ["*.py", "*.list"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["evla_pipe"]
known_third_party = ["casatasks", "casatools", "casaplotms", "numpy", "scipy"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true