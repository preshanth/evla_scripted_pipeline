[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evla_pipeline"
version = "2.0.0"
description = "Automated calibration pipeline for VLA data"
readme = "README.md"
authors = [
    {name = "National Radio Astronomy Observatory", email = "help@nrao.edu"}
]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy >= 1.20.0",
    "scipy >= 1.5.0",
]

[project.optional-dependencies]
# CASA-related packages are optional because many environments use the
# CASA distribution which provides these packages outside of PyPI. To use
# full pipeline functionality (plotting, casatasks/casatools), install with
# the `casa` extra or install CASA-provided packages separately.
casa = [
    "casatasks >= 6.1",
    "casatools >= 6.1",
    # casaplotms versions >=6.x are not available on PyPI; use a
    # realistic lower bound that exists on PyPI so the optional extra
    # can be installed. Users with CASA distributions can still provide
    # their system's casaplotms package.
    "casaplotms >= 1.2.8",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
fix = true
select = ["E", "F", "W", "I", "C", "B"]

[project.urls]
Homepage = "https://github.com/your-org/evla-scripted-pipeline"
Repository = "https://github.com/your-org/evla-scripted-pipeline"
"Bug Tracker" = "https://github.com/your-org/evla-scripted-pipeline/issues"

[project.scripts]
evla-pipeline = "evla_pipe.run_pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evla_pipe*"]

[tool.setuptools.package-data]
evla_pipe = ["*.py", "*.list"]