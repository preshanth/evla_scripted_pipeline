[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evla_pipeline"
version = "2.0.0"
description = "Automated calibration pipeline for VLA data"
readme = "README.md"
authors = [
    {name = "National Radio Astronomy Observatory", email = "help@nrao.edu"}
]
license = {text = "GPL-2.0-or-later"}
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy >= 1.20.0",
    "scipy >= 1.5.0",
]

[project.optional-dependencies]
# CASA-related packages are optional because many environments use the
# CASA distribution which provides these packages outside of PyPI. To use
# full pipeline functionality (plotting, casatasks/casatools), install with
# the `casa` extra or install CASA-provided packages separately.
casa = [
    "casatasks >= 6.1",
    "casatools >= 6.1",
    # casaplotms versions >=6.x are not available on PyPI; use a
    # realistic lower bound that exists on PyPI so the optional extra
    # can be installed. Users with CASA distributions can still provide
    # their system's casaplotms package.
    "casaplotms >= 1.2.8",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
fix = true
select = ["E", "F", "W", "I", "C", "B"]

[project.urls]
Homepage = "https://github.com/your-org/evla-scripted-pipeline"
Repository = "https://github.com/your-org/evla-scripted-pipeline"
"Bug Tracker" = "https://github.com/your-org/evla-scripted-pipeline/issues"

[project.scripts]
evla-pipeline = "evla_pipe.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evla_pipe*"]

[tool.setuptools.package-data]
evla_pipe = ["*.py", "*.list", "data/*.txt", "data/*.dat"]
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
evla_pipeline = { path = ".", editable = true }

[tool.pixi.dependencies]
pytest = ">=8.0"
ruff = ">=0.4"

[tool.pixi.environments]
default = { solve-group = "default" }
casa = { features = ["casa"], solve-group = "casa" }

[tool.pixi.feature.casa.dependencies]
# casatools PyPI wheels require Python 3.10.
# Pin here so pixi does not pick a newer Python that has no casatools wheel.
python = "3.10.*"
pytest = ">=8.0"
ruff = ">=0.4"

[tool.pixi.feature.casa.pypi-dependencies]
# casaplotms uses protobuf generated code incompatible with protobuf>=4.
# This pin is a hard requirement — do not bump without testing casaplotms.
protobuf = "==3.20.3"

[tool.pixi.tasks]
lint = "ruff check evla_pipe/ && ruff format --check evla_pipe/"

[tool.pixi.feature.casa.tasks]
test = "pytest -q test/test_run_startup.py test/test_run_import.py test/test_run_msmd.py test/test_run_preflag.py test/test_run_priorcals.py test/test_run_setjy.py test/test_run_initial_bp.py test/test_run_initial_rflag.py test/test_run_semi_final_bp.py test/test_run_solint.py test/test_run_fluxboot.py test/test_run_apply_cals.py"
