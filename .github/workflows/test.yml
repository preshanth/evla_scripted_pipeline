name: Test Pipeline

on:
  # Workflow is disabled by default - only runs on manual trigger
  # To enable automatic runs, uncomment the push/pull_request triggers below
  # push:
  #   branches: [ main, develop ]
  # pull_request:
  #   branches: [ main, develop ]
  workflow_dispatch:

jobs:
  lint:
    name: Code Quality Checks
    # Use self-hosted runner (configure with: Settings → Actions → Runners → New self-hosted runner)
    # For GitHub-hosted runners, change to: runs-on: ubuntu-latest
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort mypy pytest pytest-cov
        pip install -e . || echo "Package install failed, continuing with dev tools"

    - name: Check code formatting with black
      run: |
        black --check --diff evla_pipe/
      continue-on-error: true

    - name: Check import ordering with isort
      run: |
        isort --check-only --diff evla_pipe/
      continue-on-error: true

    - name: Type checking with mypy
      run: |
        mypy evla_pipe/ --install-types --non-interactive || true
      continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-test-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-test-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
        # Install test requirements if they exist
        if [ -f test/requirements.txt ]; then pip install -r test/requirements.txt; fi
        # Install package
        pip install -e . || echo "Package install skipped - CASA not available in CI"

    - name: Run unit tests
      run: |
        pytest test/ -v --cov=evla_pipe --cov-report=xml --cov-report=term
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  package:
    name: Build Package
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: python-package
        path: dist/

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: false
        tags: evla-pipeline:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Test Docker image
      run: |
        docker run evla-pipeline:test --version
        docker run evla-pipeline:test --help
